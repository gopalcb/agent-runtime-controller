          "summary": "Read a regular file safely, returning None only for a missing path."
        },
        "SafeRoot.write": {
          "summary": "Atomically replace a regular file without following symlinks."
        },
        "SafeRoot.remove": {
          "summary": "Unlink only the named entry; never recursively remove directories."
        },
        "SafeRoot.read_json": {
          "summary": "Read JSON state or return its explicit default when absent."
        },
        "SafeRoot.write_json": {
          "summary": "Persist formatted JSON with atomic replacement."
        },
        "SafeRoot.lock": {
          "summary": "Hold a kernel lock; crashes release it without unsafe stale-lock deletion."
        }
      }
