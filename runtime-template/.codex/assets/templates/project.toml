# Copy to <project>/.codex/project.toml and populate from verified project facts.
# Paths are relative to the project root.
# Remove unused sections. Uncomment examples only after verifying them.
# This is navigation metadata, not built-in Codex configuration.

schema_version = 1

# name = "actual-project-name"
# languages = ["python"]

[paths]
# source = ["src"]
# tests = ["tests"]

[docs]
# overview = "README.md"
# architecture = "docs/architecture.md"
# development = "docs/development.md"
# code_index = "docs/code-index.md"
# tasks = "docs/tasks"

[examples]
# service = "path/to/representative/service.py"
# test = "path/to/representative/test.py"

